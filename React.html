<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Debug Screen</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            /* พื้นหลังสีน้ำเงินเข้มแบบ Gradient */
            background: linear-gradient(135deg, #004e92 0%, #000428 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="root">
        <div class="status-card">
            <h2>Waiting for React...</h2>
            <p>หากหน้าจอนี้ไม่เปลี่ยนไป แสดงว่าไม่ได้เชื่อมต่ออินเทอร์เน็ต</p>
        </div>
    </div>

    <script type="text/babel">
        function App() {
            return (
                <div className="status-card">
                    <h1 style={{fontSize: '2rem', marginBottom: '10px'}}>React is Working!</h1>
                    <p>ESP32 Dashboard พร้อมใช้งานแล้ว</p>
                    <div style={{
                        marginTop: '20px',
                        padding: '10px',
                        background: '#00c6ff',
                        borderRadius: '10px',
                        fontWeight: 'bold'
                    }}>
                        Status: Connected
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
